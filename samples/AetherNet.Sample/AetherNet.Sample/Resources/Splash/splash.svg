<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The launch screen. Same mark as the icon and the header, so the app looks like one thing from the
  moment it is tapped. This was the .NET bot on template purple.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4aa8ff" />
            <stop offset="0.55" stop-color="#2196F3" />
            <stop offset="1" stop-color="#1976D2" />
        </linearGradient>
    </defs>
    <circle cx="228" cy="228" r="128" fill="none" stroke="url(#brand)" stroke-width="72" />
</svg>
