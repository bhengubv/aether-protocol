<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Aether's mark: the ring the app already wears in its own header (.glyph in MainLayout.razor.css —
  a brand-to-brand-deep sweep with the surface punched out of the middle). The launcher icon is the
  first thing anyone sees of this app, and it was the stock .NET bot.

  The header uses a conic sweep, which SVG has no primitive for; a linear gradient across the same
  two brand stops reads the same at icon sizes.
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4aa8ff" />
            <stop offset="0.55" stop-color="#2196F3" />
            <stop offset="1" stop-color="#1976D2" />
        </linearGradient>
    </defs>
    <circle cx="228" cy="228" r="109" fill="none" stroke="url(#brand)" stroke-width="62" />
</svg>
