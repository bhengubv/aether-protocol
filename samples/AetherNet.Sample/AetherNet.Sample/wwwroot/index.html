<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Aether</title>
    <base href="/" />
    <!-- No Bootstrap: Aether has its own design system in app.css, and Bootstrap's generic class
         names (.row, .card, .btn, .nav) silently override ours — .row's flex-wrap was stacking the
         chat list. Removed rather than fought. -->
    <link rel="stylesheet" href="_content/AetherNet.Sample.Shared/app.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="AetherNet.Sample.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <!--
        The app opening, showing what it is.

        "Loading..." is the app admitting it has nothing to say, and on a phone the .NET runtime takes
        a second or two to start — so that admission was the first thing anyone ever saw. This uses the
        wait instead of apologising for it: a mesh assembling itself, which is literally what the app
        does the moment it is running. Nodes arrive, links draw between them, and packets move.

        Deliberately NOT a splash: nothing to dismiss, nothing to sign into, and not one frame of delay
        added to make it visible. It is on screen exactly as long as the runtime takes. Everything is
        inline because it must paint before any stylesheet has been fetched, and it repeats the few
        colour tokens it needs rather than waiting on app.css.
    -->
    <div id="app">
        <div class="boot" aria-label="Aether is starting">
            <div class="boot-stage">
                <svg class="boot-mesh" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Links first, so nodes sit on top of them. Each draws itself, staggered, so the
                         mesh looks discovered rather than declared. -->
                    <g class="lnk" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                        <line x1="120" y1="120" x2="120" y2="34"  style="--d:.05s" />
                        <line x1="120" y1="120" x2="60"  y2="70"  style="--d:.18s" />
                        <line x1="120" y1="120" x2="180" y2="68"  style="--d:.31s" />
                        <line x1="120" y1="120" x2="44"  y2="160" style="--d:.44s" />
                        <line x1="120" y1="120" x2="196" y2="156" style="--d:.57s" />
                        <line x1="120" y1="120" x2="120" y2="210" style="--d:.70s" />
                        <!-- Peripheral links: without these it is a star, and a star has a centre
                             everything depends on. A mesh does not. -->
                        <line x1="60"  y1="70"  x2="120" y2="34"  style="--d:.83s" />
                        <line x1="120" y1="34"  x2="180" y2="68"  style="--d:.92s" />
                        <line x1="44"  y1="160" x2="120" y2="210" style="--d:1.01s" />
                        <line x1="120" y1="210" x2="196" y2="156" style="--d:1.10s" />
                    </g>

                    <!-- Packets, travelling the links. Proof the mesh is for something. -->
                    <g fill="currentColor" class="pkt">
                        <circle r="3.2">
                            <animateMotion dur="1.9s" repeatCount="indefinite" begin="1.2s"
                                           path="M120,120 L120,34" />
                        </circle>
                        <circle r="3.2">
                            <animateMotion dur="2.3s" repeatCount="indefinite" begin="1.7s"
                                           path="M196,156 L120,120" />
                        </circle>
                        <circle r="3.2">
                            <animateMotion dur="2.1s" repeatCount="indefinite" begin="2.2s"
                                           path="M44,160 L120,210" />
                        </circle>
                    </g>

                    <!-- The other phones. -->
                    <g class="nd" fill="currentColor">
                        <circle cx="120" cy="34"  r="7" style="--d:.10s" />
                        <circle cx="60"  cy="70"  r="7" style="--d:.23s" />
                        <circle cx="180" cy="68"  r="7" style="--d:.36s" />
                        <circle cx="44"  cy="160" r="7" style="--d:.49s" />
                        <circle cx="196" cy="156" r="7" style="--d:.62s" />
                        <circle cx="120" cy="210" r="7" style="--d:.75s" />
                    </g>

                    <!-- This one. Larger, ringed, and breathing — you are a node like any other, and
                         you are the one holding the phone. -->
                    <circle class="me-ring" cx="120" cy="120" r="17" stroke="currentColor" stroke-width="2" />
                    <circle class="me" cx="120" cy="120" r="9" fill="currentColor" />
                </svg>
            </div>

            <div class="boot-name">Aether</div>
            <div class="boot-sub">no towers · no accounts · nobody in the middle</div>
        </div>
    </div>

    <style>
        /* Light by default, dark when the phone is — the app's own surfaces, so nothing changes colour
           underneath the user when Blazor takes over. */
        .boot { --b-bg: #eaeef3; --b-ink: #16232f; --b-dim: #8a97a6; --b-brand: #2196F3; }
        @media (prefers-color-scheme: dark) {
            .boot { --b-bg: #0f1720; --b-ink: #eaf1f8; --b-dim: #7c8b9c; }
        }

        .boot {
            position: fixed; inset: 0; background: var(--b-bg); overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        }

        .boot-stage { width: min(62vw, 240px); aspect-ratio: 1; color: var(--b-brand); }
        .boot-mesh { width: 100%; height: 100%; overflow: visible; }

        /* Each link draws itself. 200 comfortably exceeds the longest line here, so one dash covers
           any of them and they can share a keyframe. */
        .lnk line {
            stroke-dasharray: 200; stroke-dashoffset: 200; opacity: .55;
            animation: draw .55s ease-out forwards; animation-delay: var(--d);
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        .nd circle {
            transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0;
            animation: pop .42s cubic-bezier(.2, 1.5, .4, 1) forwards; animation-delay: var(--d);
        }
        @keyframes pop { to { transform: scale(1); opacity: 1; } }

        .me, .me-ring { transform-box: fill-box; transform-origin: center; }
        .me-ring { opacity: .35; animation: breathe 2.6s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(1);    opacity: .35; }
            50%      { transform: scale(1.25); opacity: .08; }
        }

        .pkt circle { opacity: .9; }

        .boot-name {
            margin-top: 26px; font-size: 1.9rem; font-weight: 830; letter-spacing: -0.03em;
            color: var(--b-ink);
            opacity: 0; animation: rise .6s ease-out .55s forwards;
        }
        .boot-sub {
            font-size: .82rem; color: var(--b-dim);
            opacity: 0; animation: rise .6s ease-out .8s forwards;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

        /* Someone who has asked for less movement gets the finished picture, immediately. */
        @media (prefers-reduced-motion: reduce) {
            .lnk line { stroke-dashoffset: 0; animation: none; }
            .nd circle { transform: none; opacity: 1; animation: none; }
            .me-ring { animation: none; }
            .pkt { display: none; }
            .boot-name, .boot-sub { opacity: 1; animation: none; }
        }
    </style>

    <!-- The on-screen keyboard does not change 100vh, so a full-height screen keeps its old size and
         one end of it — the conversation header or the composer — ends up behind the keyboard. The
         visual viewport is the only thing that reports the area you can actually see, so publish its
         height and let the layout use that instead. -->
    <script>
        (function () {
            var vv = window.visualViewport;
            if (!vv) return;
            function apply() {
                // Height alone is not enough: Android also *pans* the window, which slides a
                // top-anchored screen off the top of the display. offsetTop is how far it slid.
                document.documentElement.style.setProperty('--vvh', vv.height + 'px');
                document.documentElement.style.setProperty('--vvt', vv.offsetTop + 'px');
            }
            vv.addEventListener('resize', apply);
            vv.addEventListener('scroll', apply);
            apply();
        })();
    </script>

    <!-- A conversation is read from the bottom: the newest message is the one you want, so the thread
         always opens and stays at the end rather than at the first thing ever said. -->
    <script>
        window.aetherScrollToEnd = function (el) { if (el) el.scrollTop = el.scrollHeight; };
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
