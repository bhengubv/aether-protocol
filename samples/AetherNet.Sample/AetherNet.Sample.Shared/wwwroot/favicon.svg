<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Same mark as the app icon, the splash and the header — the browser tab is part of the app too. -->
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4aa8ff" />
            <stop offset="0.55" stop-color="#2196F3" />
            <stop offset="1" stop-color="#1976D2" />
        </linearGradient>
    </defs>
    <rect width="64" height="64" rx="14" fill="#16232f" />
    <circle cx="32" cy="32" r="15" fill="none" stroke="url(#brand)" stroke-width="9" />
</svg>
