[package]
name = "aethernet-protocol"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["The Other Bhengu (Pty) Ltd t/a The Geek Network <engineering@thegeeknetwork.dev>"]
license = "MIT"
description = "Aether mesh networking protocol — offline-first P2P mesh via BLE, Wi-Fi Direct, LoRa, NFC, NearLink, and cellular relay"
repository = "https://github.com/bhengubv/aether-protocol"
homepage = "https://github.com/bhengubv/aether-protocol"
documentation = "https://docs.rs/aethernet-protocol"
readme = "README.md"
keywords = ["mesh", "networking", "p2p", "bluetooth", "protocol"]
categories = ["network-programming", "cryptography"]
exclude = ["benches/", "tests/", "target/"]

[dependencies]
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
proptest = "1.4"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "aethernet"
harness = false
