[package]
name = "aethernet-protocol"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["The Other Bhengu (Pty) Ltd t/a The Geek Network <engineering@thegeeknetwork.dev>"]
license = "MIT"
description = "Aether mesh networking protocol — offline-first P2P mesh via BLE, Wi-Fi Direct, LoRa, NFC, NearLink, and cellular relay"
repository = "https://github.com/bhengubv/aether-protocol"
homepage = "https://github.com/bhengubv/aether-protocol"
documentation = "https://docs.rs/aethernet-protocol"
readme = "README.md"
keywords = ["mesh", "networking", "p2p", "bluetooth", "protocol"]
categories = ["network-programming", "cryptography"]
exclude = ["benches/", "tests/", "target/"]

[features]
# The real WebRTC P2P transport (webrtc-rs). Off by default: it is a heavy
# native dependency, and the in-process transport covers the default build.
# `--all-features` (or `--features webrtc`) pulls it in and compiles the
# `transport::webrtc` module.
webrtc = ["dep:webrtc", "dep:bytes"]
# Real LoRa transport (serialport crate). Off by default — pulls a platform serial dependency.
lora = ["dep:serialport"]

[dependencies]
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
aes-gcm = "=0.11.0-rc.4"
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
base64 = "0.22"
# Real WebRTC P2P transport (pure-Rust webrtc-rs, classic flat-module API).
# Optional — gated by the `webrtc` feature so the default build stays free of
# the native stack. Pinned to the 0.12 stable line (not the 0.20 *alpha*, which
# is a sans-IO rewrite over the `rtc` umbrella crate with a different API).
webrtc = { version = "0.12", optional = true }
# Zero-copy byte buffers — the `webrtc` data-channel `send` API takes `&Bytes`.
# Pulled only with the `webrtc` feature; bytes 1.x is a single compatible major,
# so it resolves to the same crate version webrtc-rs uses.
bytes = { version = "1", optional = true }
# Real LoRa serial transport (RYLR-class SX127x/SX126x AT). Optional — gated by the `lora` feature.
serialport = { version = "4", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
proptest = "1.4"
divan = "0.1"

[[bench]]
name = "aethernet"
harness = false
