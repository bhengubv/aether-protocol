name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  csharp:
    name: "C# (.NET 10)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore AetherProtocol.slnx
      - run: dotnet build AetherProtocol.slnx -c Release --no-restore
      - run: dotnet test AetherProtocol.slnx -c Release --no-build --logger "console;verbosity=normal"

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go/go.sum
      - run: go test ./... -v -count=1
        working-directory: go
      - run: go run ./cmd/demo
        working-directory: go

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: python
      - run: python -m pytest -v
        working-directory: python

  kotlin:
    name: Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: kotlin/build.gradle.kts
      - run: ./gradlew test --no-daemon
        working-directory: kotlin

  swift:
    name: Swift
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build
        working-directory: swift
      - run: swift test
        working-directory: swift

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --all-features
        working-directory: rust

  c:
    name: C (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev cmake ninja-build
      - run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -S . -B build
        working-directory: c
      - run: cmake --build build
        working-directory: c
      - run: cmake --build build --target aether-tests && ctest --test-dir build --output-on-failure
        working-directory: c

  fixtures:
    name: "Fixture corpus integrity"
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go/go.sum
      - run: go run ./cmd/fixturegen
        working-directory: go
      - name: Fail if fixtures differ from committed state
        run: git diff --exit-code fixtures/expected/