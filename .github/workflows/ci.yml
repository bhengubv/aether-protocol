name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  csharp:
    name: "C# (.NET 10)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore AetherNetProtocol.slnx
      - run: dotnet build AetherNetProtocol.slnx -c Release --no-restore
      - run: dotnet test AetherNetProtocol.slnx -c Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csharp-coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go/go.sum
      - run: go mod verify
        working-directory: go
      - run: go test ./... -v -count=1
        working-directory: go
      - run: go run ./cmd/demo
        working-directory: go

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[dev]"
        working-directory: python
      - run: python -m pytest -v
        working-directory: python

  kotlin:
    name: Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: kotlin/build.gradle.kts
      - run: ./gradlew test --no-daemon
        working-directory: kotlin

  swift:
    name: Swift
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build
        working-directory: swift
      # Only XCTest tests exist; disable the swift-testing runner (it can abort, signal 6,
      # on the macOS runner toolchain) so the XCTest suite is the source of truth.
      - run: swift test
        working-directory: swift

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The LoRa `serialport` feature (enabled by --all-features) links libudev-sys on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo test --all-features
        working-directory: rust

  rust-msrv:
    name: "Rust (MSRV 1.88)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: msrv-1.88
      # The LoRa `serialport` feature (enabled by --all-features) links libudev-sys on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      # Build only (no tests) — ensures the public API compiles on the declared MSRV. 1.85 is
      # the real floor: a transitive dep (hybrid-array) requires the edition2024 Cargo feature,
      # stabilised in Rust 1.85.
      - run: cargo build --all-features
        working-directory: rust

  c:
    name: C (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev cmake ninja-build
      - run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -S . -B build
        working-directory: c
      - run: cmake --build build
        working-directory: c
      - run: cmake --build build --target aether-tests && ctest --test-dir build --output-on-failure
        working-directory: c

  android:
    name: "Android (${{ matrix.app }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [blue, green, red, teal, white]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: android/${{ matrix.app }}/gradle/wrapper/gradle-wrapper.properties
      - run: ./gradlew assembleDebug test --no-daemon
        working-directory: android/${{ matrix.app }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.app }}-test-results
          path: android/${{ matrix.app }}/app/build/reports/tests/
          if-no-files-found: ignore

  fixtures:
    name: "Fixture corpus integrity"
    runs-on: ubuntu-latest
    needs: [csharp, go, typescript, python, kotlin, swift, rust, c, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go/go.sum
      - run: go run ./cmd/fixturegen
        working-directory: go
      - name: Fail if fixtures differ from committed state
        run: git diff --exit-code fixtures/expected/