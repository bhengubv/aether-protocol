name: Fixture interop

# Cross-language fixture verification: every implementation reads the same
# fixtures under fixtures/signal/expected/*.json and asserts byte-identity
# against its own crypto + serializer. Runs on Linux only — the fixtures
# themselves are platform-independent and Linux is the canonical CI target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fixture-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  csharp-fixtures:
    name: C# fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run FixtureTests + SignalFixtureTests
        run: |
          dotnet test tests/Aether.Core.Tests/Aether.Core.Tests.csproj \
            -c Release \
            --nologo \
            --filter "FullyQualifiedName~FixtureTests|FullyQualifiedName~SignalFixtureTests"

  go-fixtures:
    name: Go fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum
      - name: Run fixture tests
        run: go test ./... -run "Fixture|Signal" -v

  python-fixtures:
    name: Python fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run fixture tests
        run: python -m pytest tests/test_fixtures.py tests/test_signal_protocol.py -v

  typescript-fixtures:
    name: TypeScript fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Run fixture tests
        shell: bash
        run: |
          set -e
          for f in tests/fixtures.test.ts tests/signal_protocol.test.ts; do
            echo "::group::$f"
            npx tsx --test "$f"
            echo "::endgroup::"
          done

  rust-fixtures:
    name: Rust fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ubuntu-latest-cargo-${{ hashFiles('rust/Cargo.lock') }}-fixtures
          restore-keys: |
            ubuntu-latest-cargo-
      - name: Run fixture tests
        run: cargo test --test fixture_tests --test signal_fixture_tests -- --nocapture

  c-fixtures:
    name: C fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config cmake
      - name: Configure + build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target all
      - name: Run fixture tests
        working-directory: c/build
        run: ctest --output-on-failure -R "fixture|signal"
