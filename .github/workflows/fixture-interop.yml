name: Fixture interop

# Cross-language fixture verification: every implementation reads the same
# fixtures under fixtures/signal/expected/*.json and asserts byte-identity
# against its own crypto + serializer. Runs on Linux only — the fixtures
# themselves are platform-independent and Linux is the canonical CI target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fixture-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  csharp-fixtures:
    name: C# fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run FixtureTests + SignalFixtureTests (AetherNet.Core.Tests)
        run: |
          dotnet test tests/AetherNet.Core.Tests/AetherNet.Core.Tests.csproj \
            -c Release \
            --nologo \
            --filter "FullyQualifiedName~FixtureTests|FullyQualifiedName~SignalFixtureTests"
      - name: Run cross-language Signal runner (AetherNet.InteropTest)
        run: |
          dotnet test tests/cross-language/runners/csharp/AetherNet.InteropTest.csproj \
            -c Release \
            --nologo

  go-fixtures:
    name: Go fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum
      - name: Run fixture tests
        run: go test ./... -run "Fixture|Signal" -v

  python-fixtures:
    name: Python fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run fixture tests
        run: python -m pytest tests/test_fixtures.py tests/test_signal_protocol.py -v

  typescript-fixtures:
    name: TypeScript fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Run fixture tests
        shell: bash
        run: |
          set -e
          for f in tests/fixtures.test.ts tests/signal_protocol.test.ts; do
            echo "::group::$f"
            npx tsx --test "$f"
            echo "::endgroup::"
          done

  rust-fixtures:
    name: Rust fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ubuntu-latest-cargo-${{ hashFiles('rust/Cargo.lock') }}-fixtures
          restore-keys: |
            ubuntu-latest-cargo-
      - name: Run fixture tests
        run: cargo test --test fixture_tests --test signal_fixture_tests -- --nocapture

  c-fixtures:
    name: C fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: c
    steps:
      - uses: actions/checkout@v4
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config cmake
      - name: Configure + build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target all
      - name: Run fixture tests
        working-directory: c/build
        run: ctest --output-on-failure -R "fixture|signal"

  kotlin-fixtures:
    name: Kotlin fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run FixtureTest + SignalFixtureTest
        run: |
          ./gradlew test \
            --tests "aethernet.protocol.FixtureTest" \
            --tests "aethernet.security.SignalFixtureTest"

  swift-fixtures:
    name: Swift fixture tests
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - name: Run FixtureTests + SignalFixtureTests
        # This package has only XCTest tests; under --filter the empty swift-testing runner
        # aborts (signal 6) on the macOS runner toolchain. Disable it so only XCTest runs.
        run: swift test --filter "FixtureTests|SignalFixtureTests"

  android-unit-fixtures:
    name: Android unit tests (DEX/ART proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [blue, green, red, teal, white]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ matrix.app }}-${{ hashFiles(format('android/{0}/**/*.gradle*', matrix.app)) }}
          restore-keys: ${{ runner.os }}-gradle-android-${{ matrix.app }}-

      - name: Run Android unit tests
        working-directory: android/${{ matrix.app }}
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.app }}-fixture-results
          path: android/${{ matrix.app }}/app/build/reports/tests/
          if-no-files-found: ignore
