<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AetherNet — offline-first mesh networking protocol">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- mesh motif: nodes + links -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="2">
    <line x1="980" y1="120" x2="1080" y2="230"/>
    <line x1="1080" y1="230" x2="960" y2="330"/>
    <line x1="960" y1="330" x2="1090" y2="430"/>
    <line x1="980" y1="120" x2="960" y2="330"/>
    <line x1="1080" y1="230" x2="1120" y2="360"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="980" cy="120" r="10"/>
    <circle cx="1080" cy="230" r="10"/>
    <circle cx="960" cy="330" r="10"/>
    <circle cx="1090" cy="430" r="10"/>
    <circle cx="1120" cy="360" r="7"/>
  </g>

  <text x="90" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#ffffff" letter-spacing="-2">AetherNet</text>
  <text x="92" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#ffffff" fill-opacity="0.95">offline-first mesh networking protocol</text>
  <text x="92" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#ffffff" fill-opacity="0.85">Messages, files, voice &amp; video — no internet, no servers, no sign-up.</text>

  <!-- language chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1565C0">
    <g>
      <rect x="92"  y="452" width="86"  height="44" rx="8" fill="#ffffff"/><text x="135" y="481" text-anchor="middle">C#</text>
      <rect x="190" y="452" width="96"  height="44" rx="8" fill="#ffffff"/><text x="238" y="481" text-anchor="middle">Rust</text>
      <rect x="298" y="452" width="170" height="44" rx="8" fill="#ffffff"/><text x="383" y="481" text-anchor="middle">TypeScript</text>
      <rect x="480" y="452" width="120" height="44" rx="8" fill="#ffffff"/><text x="540" y="481" text-anchor="middle">Python</text>
      <rect x="612" y="452" width="72"  height="44" rx="8" fill="#ffffff"/><text x="648" y="481" text-anchor="middle">Go</text>
      <rect x="696" y="452" width="118" height="44" rx="8" fill="#ffffff"/><text x="755" y="481" text-anchor="middle">Kotlin</text>
      <rect x="92"  y="508" width="102" height="44" rx="8" fill="#ffffff"/><text x="143" y="537" text-anchor="middle">Swift</text>
      <rect x="206" y="508" width="60"  height="44" rx="8" fill="#ffffff"/><text x="236" y="537" text-anchor="middle">C</text>
    </g>
  </g>
  <text x="288" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff" fill-opacity="0.9">· byte-identical wire format · MIT</text>
</svg>
