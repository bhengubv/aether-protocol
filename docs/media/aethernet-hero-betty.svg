<svg viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ht hd">
  <title id="ht">AetherNet — reaching the unconnected</title>
  <desc id="hd">A woman stands on a hilltop at dawn, holding her phone up toward the horizon. A signal blooms from it and spreads across the sky as a mesh of connected points, all in brand blue and slate.</desc>

  <rect width="1200" height="628" fill="#ffffff"/>

  <!-- blue dawn light (flat discs, low opacity) -->
  <circle cx="560" cy="450" r="320" fill="#2196F3" opacity="0.07"/>
  <circle cx="560" cy="470" r="200" fill="#2196F3" opacity="0.10"/>

  <!-- back hill -->
  <path d="M0 480 Q 320 392 640 458 T 1200 440 L1200 628 L0 628 Z" fill="#2196F3" opacity="0.18"/>
  <!-- front hill (slate) -->
  <path d="M0 552 Q 360 440 770 528 T 1200 548 L1200 628 L0 628 Z" fill="#2c3e50"/>

  <!-- figure: clean slate silhouette on the crest -->
  <g fill="#2c3e50">
    <circle cx="360" cy="392" r="14"/>
    <path d="M338 472 Q360 410 382 472 Z"/>
  </g>
  <path d="M352 420 Q336 440 332 464" fill="none" stroke="#2c3e50" stroke-width="8" stroke-linecap="round"/>
  <path d="M368 418 Q400 396 430 360" fill="none" stroke="#2c3e50" stroke-width="8" stroke-linecap="round"/>

  <!-- phone in the raised hand -->
  <g transform="translate(432 352) rotate(26)">
    <rect x="-9" y="-19" width="18" height="38" rx="3" fill="#2c3e50"/>
    <rect x="-6" y="-15" width="12" height="28" rx="1.5" fill="#2196F3"/>
  </g>

  <!-- signal blooming from the phone -->
  <g stroke="#2196F3" fill="none" stroke-linecap="round">
    <path d="M454 346 q22 -11 44 0" stroke-width="4" opacity="0.9"/>
    <path d="M449 330 q34 -17 70 0" stroke-width="4" opacity="0.6"/>
    <path d="M444 314 q49 -23 98 0" stroke-width="4" opacity="0.33"/>
  </g>

  <!-- the bloom becomes a mesh spreading across the sky -->
  <g stroke="#2196F3" stroke-width="2" stroke-dasharray="4 5" fill="none">
    <line x1="512" y1="322" x2="648" y2="250" opacity="0.5"/>
    <line x1="648" y1="250" x2="804" y2="298" opacity="0.5"/>
    <line x1="648" y1="250" x2="762" y2="158" opacity="0.4"/>
    <line x1="804" y1="298" x2="960" y2="212" opacity="0.45"/>
    <line x1="960" y1="212" x2="1052" y2="286" opacity="0.4"/>
    <line x1="960" y1="212" x2="1066" y2="150" opacity="0.33"/>
  </g>
  <g fill="#2196F3">
    <circle cx="648" cy="250" r="8"/>
    <circle cx="804" cy="298" r="8"/>
    <circle cx="960" cy="212" r="8"/>
    <circle cx="762" cy="158" r="6" opacity="0.8"/>
    <circle cx="1052" cy="286" r="6" opacity="0.7"/>
    <circle cx="1066" cy="150" r="5" opacity="0.6"/>
  </g>
</svg>
